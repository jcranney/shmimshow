[package]
name = "shmimshow"
version = "0.1.3"
edition = "2024"

[dependencies]
risio = { version = "0.2.2", default-features = false }
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
] }
env_logger = "0.11.11"
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"

# [lib]
# crate-type = ["cdylib", "rlib"]

[profile.release]
strip = true
